<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreGED - Operacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Icon set via CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <script>
        // Authentication check
        const token = localStorage.getItem('ged_token');
        if (!token) {
            window.location.href = 'login.html';
        }
        
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) { return null; }
        }

        const payload = parseJwt(token);
        if (!payload || payload.exp < Math.floor(Date.now() / 1000)) {
            localStorage.removeItem('ged_token');
            window.location.href = 'login.html';
        }
        
        // Prevent admin from using this panel
        if(payload && (payload.role === 'admin_global' || payload.role === 'admin_instituicao')) {
            window.location.href = 'admin.html';
        }
    </script>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar glass-panel">
            <div class="logo">
                <h2>Libre<span>GED</span></h2>
            </div>
            
            <div style="flex-grow: 1; padding: 20px 0;">
                <a href="#search" class="menu-item active" data-target="search">
                    <i class="fa-solid fa-magnifying-glass" style="margin-right: 12px; font-size:18px;"></i>
                    Busca de Documentos
                </a>
                <a href="#academic" class="menu-item" data-target="academic">
                    <i class="fa-solid fa-graduation-cap" style="margin-right: 12px; font-size:18px;"></i>
                    Dossiê Acadêmico
                </a>
                <a href="#uploads" class="menu-item" data-target="uploads">
                    <i class="fa-solid fa-cloud-arrow-up" style="margin-right: 12px; font-size:18px;"></i>
                    Meus Uploads
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">?</div>
                    <div class="details">
                        <div class="name" id="user-name">Usuário</div>
                        <div class="role" id="user-role">Secretaria</div>
                    </div>
                </div>
                <div class="mt-20">
                    <button class="btn-secondary w-100" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket" style="margin-right:8px;"></i> Sair
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar glass-panel">
                <h1 id="page-title">Busca Global</h1>
            </header>

            <div class="content-area">
                
                <!-- View: Busca -->
                <section id="view-search" class="view active">
                    <div class="glass-panel" style="padding: 30px; text-align:center; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <h2 style="font-size: 36px; margin-bottom: 20px;">O que você procura?</h2>
                        <div style="width: 100%; max-width: 600px; display:flex; gap:10px;">
                            <input type="text" id="search-query" class="form-control" placeholder="Buscar por CPF, nome, código..." style="padding: 16px; font-size: 16px; width: 100%; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;">
                            <button class="btn-primary" onclick="performSearch()" style="padding: 16px 30px;"><i class="fa-solid fa-search"></i></button>
                        </div>
                        <div id="search-results" style="margin-top: 40px; width: 100%; max-width: 800px; text-align:left;">
                            <p class="text-muted" style="text-align:center;">Digite um termo para começar a busca.</p>
                        </div>
                    </div>
                </section>

                <!-- View: Dossiê Acadêmico -->
                <section id="view-academic" class="view">
                    <div class="glass-panel" style="padding: 30px; min-height: 400px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                            <h2>Novo Dossiê Acadêmico</h2>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                            <!-- Formulario Metadata -->
                            <div>
                                <div class="form-group" style="margin-bottom:15px;">
                                    <label style="display:block; margin-bottom:5px; color:var(--text-muted);">Nome do Aluno</label>
                                    <input type="text" id="student-name" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;">
                                </div>
                                <div class="form-group" style="margin-bottom:15px;">
                                    <label style="display:block; margin-bottom:5px; color:var(--text-muted);">CPF</label>
                                    <input type="text" id="student-cpf" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;">
                                </div>
                                <div class="form-group" style="margin-bottom:25px;">
                                    <label style="display:block; margin-bottom:5px; color:var(--text-muted);">Matrícula (Opcional)</label>
                                    <input type="text" id="student-reg" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:6px;">
                                </div>
                                <button class="btn-primary w-100" onclick="createDossier()">Avançar para Upload</button>
                            </div>
                            <!-- Área de Upload (Iniciamente opaca/desabilitada) -->
                            <div id="upload-zone" style="opacity: 0.5; pointer-events:none;">
                                <div style="border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 40px; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.3s ease;">
                                    <i class="fa-solid fa-file-arrow-up" style="font-size: 48px; color: var(--primary); margin-bottom:20px;"></i>
                                    <h3>Arraste documentos aqui</h3>
                                    <p class="text-muted" style="margin-top:10px;">ou clique para selecionar</p>
                                    <input type="file" id="file-input" style="display:none;" multiple>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- View: Uploads -->
                <section id="view-uploads" class="view">
                    <div class="glass-panel" style="padding: 30px; min-height: 400px;">
                        <h2>Meus Uploads Recentes</h2>
                        <table class="styled-table mt-20" style="width: 100%; border-collapse: collapse; margin-top:20px;">
                            <thead>
                                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                                    <th style="padding: 15px;">Arquivo</th>
                                    <th style="padding: 15px;">Data</th>
                                    <th style="padding: 15px;">Status</th>
                                </tr>
                            </thead>
                            <tbody id="table-my-uploads-body">
                                <tr><td colspan="3" style="text-align:center; padding:20px;">Nenhum upload recente.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        const API_URL = 'http://localhost:8000/api';
        function getAuthHeaders() {
            return { 'Authorization': 'Bearer ' + localStorage.getItem('ged_token') };
        }

        // Setup User Info
        if(payload) {
            document.getElementById('user-name').innerText = payload.sub || 'Usuário';
            document.getElementById('user-avatar').innerText = (payload.sub || 'U').charAt(0).toUpperCase();
        }

        function logout() {
            localStorage.removeItem('ged_token');
            window.location.href = 'login.html';
        }

        // Router (Hash Based)
        function handleRoute() {
            const hash = window.location.hash.substring(1) || 'search';
            
            // Update menu
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            const activeMenu = document.querySelector(`.menu-item[data-target="${hash}"]`);
            if(activeMenu) {
                activeMenu.classList.add('active');
                document.getElementById('page-title').innerText = activeMenu.innerText.trim();
            }

            // Update Views
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('active');
                v.style.display = 'none'; // reset transition
            });
            const activeView = document.getElementById('view-' + hash);
            if(activeView) {
                // trick to restart animation
                setTimeout(() => {
                    activeView.style.display = 'block';
                    activeView.classList.add('active');
                }, 10);
            }
        }

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('DOMContentLoaded', handleRoute);
    </script>
    <script src="js/app_operations.js"></script>
</body>
</html>
