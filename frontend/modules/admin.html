<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administração Geral</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="app-container">
    <nav class="sidebar glass-panel">
      <div class="logo">
        <h2>Libre<span>GED</span></h2>
      </div>
      <div class="sidebar-nav-content">
        <a href="../app.html?module=admin" class="menu-item active">
          <i class="fa-solid fa-arrow-left" style="margin-right: 12px; font-size:18px;"></i>
          Voltar ao painel
        </a>
        <a href="#" class="menu-item active">
          <i class="fa-solid fa-shield-halved" style="margin-right: 12px; font-size:18px;"></i>
          Administração
        </a>
      </div>
    </nav>

    <main class="main-content">
      <header class="topbar glass-panel">
        <div>
          <h1 id="page-title">Administração Geral</h1>
          <p id="page-subtitle" class="text-muted">Governança do sistema, usuários, instituições e workflows.</p>
        </div>
        <button class="btn-primary" type="button" onclick="window.location.href='../app.html?module=admin'">
          <i class="fa-solid fa-house"></i> Dashboard geral
        </button>
      </header>

      <div class="content-area">
        <section class="view active">
          <div class="glass-panel" style="padding: 24px; margin-bottom: 20px; border-left: 4px solid #8b5cf6;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <div>
                <div class="text-muted" style="font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Módulo</div>
                <h3 id="module-banner-title" style="margin: 8px 0 4px;">Administração Geral</h3>
                <p id="module-banner-text" class="text-muted" style="margin:0;">Governança do sistema, usuários, instituições e workflows.</p>
              </div>
              <button class="btn-secondary" type="button">
                <i class="fa-solid fa-plus"></i> Nova ação
              </button>
            </div>
          </div>

          <div id="stats-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px;"></div>

          <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
            <div class="glass-panel" style="padding: 20px;">
              <h3><i class="fa-solid fa-sliders" style="margin-right:8px; color:var(--primary);"></i> Registros de governança</h3>
              <div id="primary-list" style="margin-top: 16px;"></div>
            </div>

            <div class="glass-panel" style="padding: 20px;">
              <h3><i class="fa-solid fa-bolt" style="margin-right:8px; color:var(--primary);"></i> Ações rápidas</h3>
              <div id="quick-actions" style="display:flex; flex-direction:column; gap:10px; margin-top: 16px;"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => initModulePage('admin'));
  </script>
  <script src="./module-page.js"></script>
</body>
</html>
